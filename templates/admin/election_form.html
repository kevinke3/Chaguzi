{% extends "base.html" %}
{% block title %}{{ 'Edit' if election else 'New' }} Election{% endblock %}
{% block page_title %}{{ 'Edit' if election else 'Create' }} Election{% endblock %}
{% block body_class %}admin{% endblock %}

{% block content %}
<div class="panel">
    <form method="POST" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="name">Election Name *</label>
            <input type="text" name="name" id="name" required value="{{ election.name if election else '' }}">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea name="description" id="description" rows="3">{{ election.description if election else '' }}</textarea>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label for="election_type">Election Type</label>
                <select name="election_type" id="election_type">
                    {% set t = election.election_type if election else 'general' %}
                    <option value="general" {{ 'selected' if t=='general' }}>General</option>
                    <option value="student_council" {{ 'selected' if t=='student_council' }}>Student Council</option>
                    <option value="board" {{ 'selected' if t=='board' }}>Board</option>
                    <option value="committee" {{ 'selected' if t=='committee' }}>Committee</option>
                    <option value="leadership" {{ 'selected' if t=='leadership' }}>Leadership</option>
                    <option value="class" {{ 'selected' if t=='class' }}>Class</option>
                    <option value="custom" {{ 'selected' if t=='custom' }}>Custom</option>
                </select>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select name="status" id="status">
                    {% set s = election.status if election else 'draft' %}
                    <option value="draft" {{ 'selected' if s=='draft' }}>Draft</option>
                    <option value="scheduled" {{ 'selected' if s=='scheduled' }}>Scheduled</option>
                    <option value="active" {{ 'selected' if s=='active' }}>Active (open)</option>
                </select>
            </div>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label for="start_date">Start Date & Time *</label>
                <input type="datetime-local" name="start_date" id="start_date" required
                       value="{{ election.start_date.strftime('%Y-%m-%dT%H:%M') if election else '' }}">
            </div>
            <div class="form-group">
                <label for="end_date">End Date & Time *</label>
                <input type="datetime-local" name="end_date" id="end_date" required
                       value="{{ election.end_date.strftime('%Y-%m-%dT%H:%M') if election else '' }}">
            </div>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label for="result_visibility">Result Visibility</label>
                <select name="result_visibility" id="result_visibility">
                    {% set rv = election.result_visibility if election else 'after_close' %}
                    <option value="hidden" {{ 'selected' if rv=='hidden' }}>Hidden until announced</option>
                    <option value="live" {{ 'selected' if rv=='live' }}>Live during election</option>
                    <option value="after_close" {{ 'selected' if rv=='after_close' }}>After close</option>
                </select>
            </div>
            <div class="form-group">
                <label for="eligible_group">Eligible Group</label>
                <input type="text" name="eligible_group" id="eligible_group"
                       value="{{ election.eligible_group if election else 'all' }}">
            </div>
        </div>
        <div class="form-group">
            <label class="checkbox">
                <input type="checkbox" name="allow_vote_correction"
                    {{ 'checked' if election and election.allow_vote_correction }}>
                Allow vote correction/revoting (only before finalization)
            </label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ 'Save Changes' if election else 'Create Election' }}</button>
            <a href="{{ url_for('admin.elections') }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
